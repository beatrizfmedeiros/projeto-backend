<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="{{ url_for('static', filename='image/favicon.ico') }}" type="image/x-icon" />
  <title>{% block title %}Pizzaria 404{% endblock %}</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  {% block extra_css %}{% endblock %}
</head>
<body>

  <div id="progress-bar"></div>

  {% block navbar %}
  <header>
    <div id="navbar">
      <a href="/" id="nav_logo">
        <img src="{{ url_for('static', filename='image/icone.png') }}" alt="Logo Pizzaria 404" />
        Pizzaria 404
      </a>

      <ul id="nav_list">
        <li class="nav-item">
          <a href="/#inicio" class="nav-link-icon" data-tooltip="Início">
            <i class="fa-solid fa-house"></i>
          </a>
        </li>
        <li class="nav-item">
          <a href="/#cardapio" class="nav-link-icon" data-tooltip="Cardápio">
            <i class="fa-solid fa-pizza-slice"></i>
          </a>
        </li>
        <li class="nav-item">
          <a href="/sobre" class="nav-link-icon" data-tooltip="Sobre Nós">
            <i class="fa-solid fa-circle-info"></i>
          </a>
        </li>
        <li class="nav-item">
          <a href="/#depoimentos" class="nav-link-icon" data-tooltip="Avaliações">
            <i class="fa-solid fa-star"></i>
          </a>
        </li>
        <li class="nav-item">
          <a href="/#contato" class="nav-link-icon" data-tooltip="Contato">
            <i class="fa-solid fa-envelope"></i>
          </a>
        </li>
      </ul>

      <div class="btn-default">
        <a href="/cardapio">Peça aqui</a>
      </div>


      <div class="auth" id="auth-nav-desktop">
        <!-- Injetado dinamicamente por api.js via JWT -->
        <button onclick="window.location.href='/login'">Login</button>
        <button onclick="window.location.href='/cadastro'">Cadastro</button>
      </div>



      <button id="mobile_btn">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <!-- Menu mobile -->
  <div id="mobile_menu">
    <ul id="mobile_nav_list">
      <li class="nav-item"><a href="/#inicio"><i class="fa-solid fa-house me-2"></i> Início</a></li>
      <li class="nav-item"><a href="/#cardapio"><i class="fa-solid fa-pizza-slice me-2"></i> Cardápio</a></li>
      <li class="nav-item"><a href="/sobre"><i class="fa-solid fa-circle-info me-2"></i> Sobre Nós</a></li>
      <li class="nav-item"><a href="/#depoimentos"><i class="fa-solid fa-star me-2"></i> Avaliações</a></li>
      <li class="nav-item"><a href="/#contato"><i class="fa-solid fa-envelope me-2"></i> Contato</a></li>
      <div id="auth-nav-mobile" style="display:flex; flex-direction:column; gap:12px;">
        <li class="nav-item"><a href="/login">Login</a></li>
        <li class="nav-item"><a href="/cadastro">Cadastro</a></li>
      </div>
    </ul>
    <div class="btn-default" style="margin-top:12px;">
      <a href="/cardapio">Peça aqui</a>
    </div>

  </div>
  {% endblock %}

  {% block content %}{% endblock %}

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>



  {% block extra_js %}{% endblock %}
</body>
</html>
